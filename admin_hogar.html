<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Administrar Hogar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=20.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://unpkg.com/lucide@0.469.0"></script>
    <script>
        const savedTheme = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2"></script>
</head>
<body>
    <!-- HEADER -->
    <header class="header flex-between">
        <button onclick="window.history.back()" class="btn-icon-white" title="Volver">
            <i data-lucide="arrow-left"></i>
        </button>
        <h1 class="text-center flex-1" style="color: var(--text-main);">Administración</h1>
        <button id="btn-final" class="btn-header-save">Guardar</button>
    </header>

    <main class="container mt-15" style="padding-bottom: calc(90px + env(safe-area-inset-bottom));">
        
        <!-- Crear Nuevo Hogar -->
        <section id="seccion-nombre-hogar" class="card" style="display: none;">
            <h2>Crear Nuevo Hogar</h2>
            <p style="color: var(--text-muted); margin-bottom: 15px;">Elegí un nombre para tu espacio compartido.</p>
            <input type="text" id="input-nombre-hogar" class="form-control" placeholder="Ej: Familia">
        </section>

        <!-- Categorías -->
        <section class="card">
            <div class="flex-between mb-15">
                <h2>Categorías de la Casa</h2>
                <button id="btn-toggle-add-cat" class="btn-add-circle">
                    <i data-lucide="plus-circle"></i>
                </button>
            </div>
            
            <div id="form-add-cat-box" class="form-toggle-box" style="display: none;">
                <div class="flex-between gap-10 mb-20" style="padding: 10px;">
                    <input type="text" id="input-nueva-cat" class="form-control flex-2" placeholder="Ej: Expensas">
                    <button id="btn-add-cat" class="btn-primary flex-1">Agregar</button>
                </div>
            </div>

            <div class="grid-admin-header">
                <span class="flex-2">CATEGORÍA</span>
                <span class="text-center-flex col-icon"><i data-lucide="home"></i> FIJO</span>
                <span class="text-center-flex col-icon"><i data-lucide="shopping-cart"></i> STOCK</span>
                <span class="spacer-40"></span>
            </div>

            <ul id="lista-categorias-hogar" class="lista-minimal">
            </ul>
        </section>

        <!-- Presupuestos -->
        <section class="card">
            <div class="flex-between mb-15">
                <h2>Presupuestos del Hogar</h2>
                <button id="btn-toggle-add-fondo" class="btn-add-circle">
                    <i data-lucide="plus-circle"></i>
                </button>
            </div>

            <div id="form-add-fondo-box" class="form-toggle-box mb-20" style="display: none;">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="input-nombre-fondo" class="form-control" placeholder="Ej: Expensas">
                </div>
                <div class="form-group">
                    <label>Monto ($)</label>
                    <input type="number" id="input-monto-fondo" class="form-control" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Categorías</label>
                    <div id="check-categorias-vinculadas" class="grid-checkbox-fondos"></div>
                </div>
                <button id="btn-crear-fondo" class="btn-primary w-100">Crear</button>
            </div>

            <ul id="lista-fondos-hogar" class="lista-minimal">
                <li class="text-center text-muted p-20">Sin presupuestos.</li>
            </ul>
        </section>

        <!-- Medios de Pago Compartidos -->
        <section class="card mb-20">
            <div class="flex-between mb-15">
                <h2>Medios de Pago Compartidos</h2>
                <button id="btn-agregar-pago-hogar" class="btn-add-circle">
                    <i data-lucide="plus-circle"></i>
                </button>
            </div>

            <ul id="lista-metodos-pago-hogar" class="lista-minimal">
                <li class="text-center text-muted p-20">Aún no hay medios de pago.</li>
            </ul>
        </section>

        <!-- Miembros -->
    </main>
    
    <!-- Modal Invitación -->
    <div id="modal-link-invitacion" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 style="color: var(--text-main); margin-top: 0;">Invitar al Hogar</h3>
            <p style="color: var(--text-muted); margin-bottom: 15px;">Compartí este enlace:</p>
            <input type="text" id="input-link-generado" class="form-control mb-15" readonly>
            <div class="flex-between gap-10">
                <button id="btn-copiar-link-modal" class="btn-primary flex-1">Copiar</button>
                <button id="btn-cerrar-modal-link" class="btn-secondary flex-1">Cerrar</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav" id="nav-contextual"></nav>
    <div id="toast-container" class="toast"></div>
    
    <script type="module" src="js/auth_guard.js?v=20.0"></script>
    <script type="module" src="js/controller_admin_hogar.js?v=20.0"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="js/pwa.js?v=1"></script>
</body>
</html>
