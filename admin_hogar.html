<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Administrar Hogar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=6.0">
    <meta name="theme-color" content="#10b981">
</head>
<body>
    <header class="header flex-between">
        <button onclick="window.history.back()" class="btn-icon-white">← Volver</button>
        <h1 class="text-center flex-1" id="header-titulo">Categorías y Fondos</h1>
        <div class="header-spacer"></div>
    </header>

    <main class="container mt-15">
        <section id="seccion-nombre-hogar" class="card-clean mb-20 text-center" style="display: none;">
            <h2 class="card-title-green">Crear Nuevo Hogar</h2>
            <p class="text-sm-gray mb-15">Elegí un nombre para tu espacio compartido.</p>
            <input type="text" id="input-nombre-hogar" class="form-control mb-15" placeholder="Ej: Familia / Depto">
        </section>

        <section class="card-clean mb-20" style="border-top: 4px solid var(--primary-color);">
            <div class="flex-between mb-15">
                <h2 class="card-title-green m-0">Categorías de la Casa</h2>
                <button id="btn-toggle-add-cat" class="btn-add-circle" title="Agregar Categoría">＋</button>
            </div>
            
            <div id="form-add-cat-box" class="form-toggle-box" style="display: none;">
                <div class="flex-between gap-10 mb-20" style="background: var(--bg-app); padding: 10px; border-radius: 8px;">
                    <input type="text" id="input-nueva-cat" class="form-control flex-2" placeholder="Ej: Expensas, Internet">
                    <button id="btn-add-cat" class="btn-primary flex-1 btn-no-margin" style="padding: 12px;">Agregar</button>
                </div>
            </div>

            <div class="grid-admin-header mb-10">
                <span class="flex-2">CATEGORÍA</span>
                <span class="text-center-flex">FIJO 🏠</span>
                <span class="text-center-flex">STOCK 🛒</span>
                <span class="spacer-40"></span>
            </div>

            <ul id="lista-categorias-hogar" class="lista-minimal">
                </ul>
        </section>

        <section class="card-clean mb-30" style="border-top: 4px solid #d97706;">
            <div class="flex-between mb-15">
                <h2 class="card-title-orange m-0">Presupuestos Compartidos</h2>
                <button id="btn-toggle-add-fondo" class="btn-add-circle" title="Crear Presupuesto">＋</button>
            </div>
            
            <div id="form-add-fondo-box" class="form-toggle-box mb-20" style="display: none; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;">
                <div class="form-group">
                    <label>Nombre del Fondo</label>
                    <input type="text" id="input-nombre-fondo" class="form-control" placeholder="Ej: Supermercado, Alquiler...">
                </div>
                <div class="form-group">
                    <label>Monto Inicial ($)</label>
                    <input type="number" id="input-monto-fondo" class="form-control" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Vincular Categorías</label>
                    <div id="check-categorias-vinculadas" class="grid-checkbox-fondos p-0 border-0 bg-transparent">
                        
                    </div>
                </div>
                <button id="btn-crear-fondo" class="btn-primary w-100" style="background-color: #d97706;">Crear Presupuesto</button>
            </div>

            <ul id="lista-fondos-hogar" class="lista-minimal">
                </ul>
        </section>

        <button id="btn-final" class="btn-primary w-100 mb-30" style="background-color: #388e3c; padding: 15px; font-size: 1.2rem; box-shadow: var(--shadow-md);">Guardar Cambios</button>
    </main>

    <div id="modal-link-invitacion" class="modal-overlay" style="display: none;">
        <div class="modal-content text-center">
            <h3 class="card-title-green mb-15" style="margin-top: 0;">¡Hogar Creado! 🏠</h3>
            <p class="text-sm-gray mb-15">Compartí este link con los demás integrantes:</p>
            <input type="text" id="input-link-generado" class="form-control mb-15 text-center" readonly>
            <button id="btn-copiar-link-modal" class="btn-primary w-100 mb-10">🔗 Copiar Link</button>
            <button id="btn-cerrar-modal-link" class="btn-secondary w-100">Ir al Inicio</button>
        </div>
    </div>

    <div id="toast-container" class="toast"></div>

    <script type="module" src="js/auth_guard.js?v=6.0"></script>
    <script type="module" src="js/controller_admin_hogar.js?v=6.0"></script>
</body>
</html>
