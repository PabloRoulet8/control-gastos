<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Hogar</title>
    <link rel="stylesheet" href="css/styles.css">
    <meta name="theme-color" content="#2e7d32">
</head>
<body>
    <header class="header">
        <button onclick="window.location.href='index.html'" style="background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem;">← Volver</button>
        <h1>Vincular Hogar</h1>
        <div style="width: 50px;"></div>
    </header>

    <main class="container" style="padding-top: 20px;">
        
        <div class="card" style="border-top: 5px solid #2e7d32;">
            <h2 style="color: #2e7d32; margin-bottom: 5px;">Crear un Hogar</h2>
            <p style="color: #666; font-size: 0.9rem; margin-bottom: 15px;">Creá un espacio compartido para dividir gastos con tu pareja, amigos o familia.</p>
            
            <form id="form-crear-hogar">
                <div class="form-group">
                    <input type="text" id="input-nombre-hogar" required placeholder="Ej: Familia Roulet" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 1.1rem;">
                </div>
                <button type="submit" class="btn-primary" id="btn-crear">Crear y Generar Código</button>
            </form>

            <div id="resultado-codigo" style="display: none; margin-top: 15px; background: #e8f5e9; padding: 15px; border-radius: 8px; text-align: center; border: 2px dashed #4caf50;">
                <p style="margin: 0; color: #2e7d32; font-weight: bold;">¡Hogar Creado!</p>
                <p style="margin: 5px 0;">Pasale este código a los demás:</p>
                <h3 id="texto-codigo" style="font-size: 2rem; color: #1b5e20; letter-spacing: 3px; margin: 5px 0;">A1B2C3</h3>
            </div>
        </div>

        <div style="text-align: center; margin: 20px 0; color: #999; font-weight: bold;">Ó</div>

        <div class="card" style="border-top: 5px solid #1976d2;">
            <h2 style="color: #1976d2; margin-bottom: 5px;">Tengo un Código</h2>
            <p style="color: #666; font-size: 0.9rem; margin-bottom: 15px;">Si alguien ya creó el hogar, ingresá el código de invitación acá.</p>
            
            <form id="form-unirse-hogar">
                <div class="form-group">
                    <input type="text" id="input-codigo-hogar" required placeholder="Ej: X9Y8Z7" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 1.1rem; text-transform: uppercase; text-align: center; letter-spacing: 2px;">
                </div>
                <button type="submit" class="btn-primary" style="background-color: #1976d2;" id="btn-unirse">Unirse al Hogar</button>
            </form>
        </div>

    </main>

    <div id="toast-container" class="toast"></div>

    <script type="module" src="js/auth_guard.js"></script>
    <script type="module" src="js/controller_nuevo_hogar.js"></script>
</body>
</html>
