<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="css/styles.css?v=6.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header flex-between">
        <button onclick="window.history.back()" class="btn-icon-white" title="Volver al Inicio">🏠</button>
        <h1 class="text-center flex-1">Mi Perfil</h1>
        <div class="header-spacer"></div>
    </header>

    <main class="container mt-15" style="padding-bottom: 50px;">
        
        <section class="card-clean mb-20 text-center">
            <h2 class="card-title-green mb-15 m-0" style="color: var(--primary-color);">Tus Datos</h2>
            
            <div class="avatar-circle mx-auto mb-10" id="display-emoji" style="width: 60px; height: 60px; font-size: 2rem; margin: 0 auto;">👤</div>
            
            <div class="form-group text-left mt-15">
                <label>Tu Emoji (Usá el teclado)</label>
                <input type="text" id="input-emoji" class="form-control" placeholder="Elegí un emoji..." maxlength="2">
            </div>
            
            <div class="form-group text-left">
                <label>Tu Nombre</label>
                <input type="text" id="input-nombre" class="form-control" placeholder="Ej: Pablito">
            </div>
            
            <button id="btn-guardar-perfil" class="btn-primary mt-10">Guardar Cambios</button>
        </section>

        <section class="card-clean mb-20">
            <div class="flex-between mb-15">
                <h2 class="card-title-green m-0" style="color: var(--primary-color);">Mis Categorías</h2>
                <button id="btn-toggle-cat" class="btn-add-circle" title="Agregar Categoría">＋</button>
            </div>
            
            <div id="form-cat-box" class="form-toggle-box" style="display: none;">
                <div class="flex-between gap-10 mb-20" style="background: var(--bg-app); padding: 10px; border-radius: 8px;">
                    <input type="text" id="input-nueva-cat" class="form-control flex-2" placeholder="Ej: Ropa, Farmacia...">
                    <button id="btn-add-cat" class="btn-primary flex-1 btn-no-margin" style="padding: 12px;">Agregar</button>
                </div>
            </div>

            <div class="grid-admin-header mb-10">
                <span class="flex-2">CATEGORÍA</span>
                <span class="text-center-flex">FIJO 🏠</span>
                <span class="text-center-flex">STOCK 🛒</span>
                <span class="spacer-40"></span>
            </div>
            <ul id="lista-categorias-personales" class="lista-minimal">
                <li class="text-center text-muted p-20">Cargando...</li>
            </ul>
        </section>

        <section class="card-clean mb-20">
            <div class="flex-between mb-15">
                <h2 class="card-title-green m-0" style="color: var(--text-main);">Medios de Pago</h2>
                <button id="btn-toggle-pago" class="btn-add-circle" style="background: var(--text-main);">＋</button>
            </div>

            <div id="form-pago-box" class="form-toggle-box" style="display: none;">
                <div class="flex-between gap-10 mb-20" style="background: var(--bg-app); padding: 10px; border-radius: 8px;">
                    <input type="text" id="input-nuevo-pago" class="form-control flex-2" placeholder="Ej: MercadoPago, Ualá...">
                    <button id="btn-add-pago" class="btn-primary flex-1 btn-no-margin" style="padding: 12px; background: var(--text-main);">Agregar</button>
                </div>
            </div>

            <ul id="lista-metodos-pago" class="lista-minimal">
                <li class="text-center text-muted p-20">Cargando...</li>
            </ul>
        </section>

        <section class="card-clean mb-30" style="border-top: 4px solid #d97706;">
            <div class="flex-between mb-15">
                <h2 class="card-title-orange m-0" style="color: #d97706;">Mis Presupuestos</h2>
                <button id="btn-toggle-fondo" class="btn-add-circle" style="background: #d97706;">＋</button>
            </div>

            <div id="form-fondo-box" class="form-toggle-box mb-20" style="display: none; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;">
                <div class="form-group">
                    <label>Nombre del Fondo</label>
                    <input type="text" id="input-nombre-fondo" class="form-control" placeholder="Ej: Ahorro Viaje...">
                </div>
                <div class="form-group">
                    <label>Monto Inicial ($)</label>
                    <input type="number" id="input-monto-fondo" class="form-control" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Vincular Categorías</label>
                    <div id="check-categorias-vinculadas" class="grid-checkbox-fondos p-0 border-0 bg-transparent">
                        </div>
                </div>
                <button id="btn-crear-fondo" class="btn-primary w-100" style="background-color: #d97706;">Crear Fondo</button>
            </div>

            <ul id="lista-fondos-personales" class="lista-minimal">
                <li class="text-center text-muted p-20">Cargando...</li>
            </ul>
        </section>

    </main>
    
    <div id="toast-container" class="toast"></div>
    
    <script type="module" src="js/auth_guard.js?v=6.0"></script>
    <script type="module" src="js/controller_perfil.js?v=6.0"></script>
</body>
</html>
