<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Historial</title>
    <link rel="stylesheet" href="css/styles.css?v=6.1">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header flex-between">
        <button onclick="window.location.href='index.html'" class="btn-icon-white" title="Volver al Inicio">🏠</button>
        <h1 id="titulo-header" class="text-center flex-1">Mi Historial</h1>
        <div class="header-spacer"></div>
    </header>

    <main class="container mt-15" style="padding-bottom: 80px;">
        <section class="card dashboard-card">
            <h2 class="mb-15" style="color: var(--primary-color);">Filtros</h2>
            <div class="grid-2-col gap-10 mb-10">
                <select id="filtro-mes" class="form-control" style="padding: 10px;">
                    <option value="">Todos los meses</option>
                    <option value="2026-04">Abril 2026</option>
                    <option value="2026-03">Marzo 2026</option>
                </select>
                <select id="filtro-categoria" class="form-control" style="padding: 10px;">
                    <option value="todas">Todas las categorías</option>
                </select>
            </div>
            <div class="grid-2-col gap-10">
                <select id="filtro-responsable" class="form-control" style="display: none; padding: 10px;">
                    <option value="todos">Todos los responsables</option>
                </select>
                <select id="filtro-tipo" class="form-control" style="display: none; padding: 10px;">
                    <option value="todos">Todos los tipos</option>
                    <option value="general">Gasto Común</option>
                    <option value="individual">Gasto Individual</option>
                </select>
            </div>
        </section>

        <section class="card dashboard-card mt-20">
            <h2 class="mb-15" style="color: var(--text-main);">Últimos Movimientos</h2>
            <div id="contenedor-gastos">
                <p class="text-center text-muted p-20">Cargando gastos...</p>
            </div>
        </section>
    </main>

    <div id="custom-confirm" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="confirm-title" style="margin-top: 0; color: var(--text-main);">Título</h3>
            <p id="confirm-message" style="color: var(--text-muted); margin-bottom: 20px;">Mensaje</p>
            <div style="display: flex; gap: 10px;">
                <button id="confirm-cancel" class="btn-secondary" style="margin: 0;">Cancelar</button>
                <button id="confirm-ok" class="btn-primary" style="background-color: #ef4444; margin: 0;">Confirmar</button>
            </div>
        </div>
    </div>
    
    <div id="toast-container" class="toast"></div>

    <nav class="bottom-nav" id="nav-contextual"></nav>

    <script type="module" src="js/auth_guard.js?v=6.1"></script>
    <script type="module" src="js/controller_historial.js?v=6.1"></script>    
</body>
</html>
