<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Historial de Movimientos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
</head>
<body>
    <header class="header flex-between">
        <button onclick="window.history.back()" class="btn-icon-white">← Volver</button>
        <h1>Movimientos</h1>
        <div class="header-spacer"></div>
    </header>

    <main class="container">

        <section class="card mb-15">
            <div class="grid-2-col">
                <select id="filtro-tipo" class="form-select-sm">
                    <option value="todos">Todos los tipos</option>
                    <option value="general">Generales</option>
                    <option value="individual">Individuales</option>
                </select>
                <select id="filtro-responsable" class="form-select-sm">
                    <option value="todos">Cualquier persona</option>
                    <option value="mostri">Mostri</option>
                    <option value="mostrina">Mostrina</option>
                </select>
                <select id="filtro-categoria" class="form-select-sm mt-15">
                    <option value="todas">Todas las categorías</option>
                </select>
                <input type="month" id="filtro-mes" class="form-select-sm mt-15">
            </div>
        </section>

        <div id="lista-gastos"></div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="icon">➕</span>
            <span class="label">Cargar</span>
        </a>
        <a href="historial.html" class="nav-item">
            <span class="icon">📜</span>
            <span class="label">Historial</span>
        </a>
        <a href="resumen.html" class="nav-item">
            <span class="icon">📊</span>
            <span class="label">Resumen</span>
        </a>
    </nav>

    <div id="custom-confirm" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="confirm-title" class="card-title-green">¿Estás seguro?</h3>
            <p id="confirm-message">Esta acción no se puede deshacer.</p>
            <div class="modal-buttons">
                <button type="button" id="confirm-cancel" class="btn-secondary">Cancelar</button>
                <button type="button" id="confirm-ok" class="btn-primary">Eliminar</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast"></div>
    
    <script type="module" src="js/auth_guard.js"></script>
    <script type="module" src="js/controller_historial.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('Service Worker registrado!');
                });
            });
        }
    </script>
</body>
</html>
