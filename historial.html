<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Historial de Movimientos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
</head>
<body>
    <header class="header">
        <a href="index.html" class="nav-link">← Volver</a>
        <h1>Movimientos</h1>
        <div style="width: 50px;"></div>
    </header>

    <main class="container">
        <div id="lista-gastos">
            </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="icon">➕</span>
            <span class="label">Cargar</span>
        </a>
        <a href="historial.html" class="nav-item">
            <span class="icon">📜</span>
            <span class="label">Historial</span>
        </a>
        <a href="resumen.html" class="nav-item">
            <span class="icon">📊</span>
            <span class="label">Resumen</span>
        </a>
    </nav>

    <div id="custom-confirm" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="confirm-title" style="color: #2e7d32;">¿Estás seguro?</h3>
            <p id="confirm-message">Esta acción no se puede deshacer.</p>
            <div class="modal-buttons">
                <button type="button" id="confirm-cancel" class="btn-secondary">Cancelar</button>
                <button type="button" id="confirm-ok" class="btn-primary" style="background-color: #2e7d32; margin-top: 0;">Eliminar</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast"></div>

    <script type="module" src="js/controller_historial.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('Service Worker registrado!', reg);
                }).catch(err => {
                    console.log('Fallo el Service Worker:', err);
                });
            });
        }
    </script>
</body>
</html>
