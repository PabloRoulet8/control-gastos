<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Historial</title>
    <link rel="stylesheet" href="css/styles.css?v=11.2">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        document.documentElement.setAttribute(
            'data-theme', 
            localStorage.getItem('theme') || 'dark'
        );
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header class="header flex-between">
        <button onclick="window.location.href='index.html'" class="btn-icon-white" title="Volver"><i data-lucide="home"></i></button>
        <h1 id="titulo-header" class="text-center flex-1">Mi Historial</h1>
        <button id="btn-abrir-filtros" class="btn-icon-white" title="Filtrar">
            <i data-lucide="filter"></i>
        </button>
    </header>

    <main class="container mt-15" style="padding-bottom: calc(90px + env(safe-area-inset-bottom));">
        <section class="card">
            <div class="flex-between mb-15">
                <h2 style="color: var(--text-main); margin: 0;">Últimos Movimientos</h2>
            </div>
            <div id="contenedor-gastos">
                <p class="text-center text-muted p-20">Cargando gastos...</p>
            </div>
        </section>
    </main>

    <!-- MODAL DE FILTROS (Top Dropdown) -->
    <div id="modal-filtros" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i data-lucide="filter"></i> Filtros</h3>
                <button id="btn-cerrar-filtros" class="btn-cerrar-modal">
                    <i data-lucide="x"></i>
                </button>
            </div>
            
            <div class="filtros-grid">
                <div class="form-group">
                    <label>Mes</label>
                    <select id="filtro-mes" class="form-control">
                        <option value="">Todos</option>
                        <option value="2026-04">Abril 2026</option>
                        <option value="2026-03">Marzo 2026</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="filtro-categoria" class="form-control">
                        <option value="todas">Todas</option>
                    </select>
                </div>
                
                <div id="filtro-responsable-group" class="form-group" style="display: none;">
                    <label>Responsable</label>
                    <select id="filtro-responsable" class="form-control">
                        <option value="todos">Todos</option>
                    </select>
                </div>
                
                <div id="filtro-tipo-group" class="form-group" style="display: none;">
                    <label>Tipo</label>
                    <select id="filtro-tipo" class="form-control">
                        <option value="todos">Todos</option>
                        <option value="fijo">Fijos</option>
                        <option value="stock">Stock</option>
                        <option value="variable">Variables</option>
                    </select>
                </div>
            </div>
            
            <div class="filtros-acciones">
                <button id="btn-limpiar-filtros" class="btn-secondary">Limpiar</button>
                <button id="btn-aplicar-filtros" class="btn-primary">Aplicar</button>
            </div>
        </div>
    </div>

    <div id="custom-confirm" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="confirm-title" style="margin-top: 0; color: var(--text-main);">Título</h3>
            <p id="confirm-message" style="color: var(--text-muted); margin-bottom: 20px;">Mensaje</p>
            <div style="display: flex; gap: 10px;">
                <button id="confirm-cancel" class="btn-secondary" style="margin: 0;">Cancelar</button>
                <button id="confirm-ok" class="btn-primary" style="background-color: #ef4444; margin: 0;">Confirmar</button>
            </div>
        </div>
    </div>
    
    <div id="toast-container" class="toast"></div>

    <nav class="bottom-nav" id="nav-contextual"></nav>
    <script type="module" src="js/auth_guard.js?v=11.2"></script>
    <script type="module" src="js/controller_historial.js?v=11.2"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
