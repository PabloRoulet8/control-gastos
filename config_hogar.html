<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel de Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=11.0">
    <meta name="theme-color" content="#10b981">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        const savedTheme = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
    </script>
</head>
<body>
    <!-- HEADER -->
    <header class="header flex-between">
        <button onclick="window.history.back()" class="btn-icon-white" title="Volver">
            <i data-lucide="arrow-left"></i>
        </button>
        <h1 class="text-center flex-1" style="color: var(--text-main);">Panel de Control</h1>
        <button id="btn-guardar" class="btn-header-save">Guardar</button>
    </header>

    <main class="container mt-15" style="padding-bottom: calc(90px + env(safe-area-inset-bottom));">
        
        <!-- Sección: Nombre del Hogar -->
        <section class="card">
            <h2>Nombre del Hogar</h2>
            <div class="flex-between">
                <span id="display-nombre-hogar" style="font-size: 1.3rem; color: var(--text-main); font-weight: 600;">Cargando...</span>
                <button id="btn-edit-name-toggle" class="btn-icon-white">
                    <i data-lucide="pencil"></i>
                </button>
            </div>
            <div id="edit-name-box" style="display: none; margin-top: 12px;">
                <input type="text" id="edit-nombre-hogar" class="form-control" placeholder="Nuevo nombre...">
                <button id="btn-actualizar-nombre" class="btn-primary" style="margin-top: 10px;">Guardar</button>
            </div>
        </section>

        <!-- Sección: Miembros -->
        <section class="card">
            <h2>Miembros del Equipo</h2>
            <ul id="lista-gestion-miembros" class="lista-integrantes">
                <li class="text-center text-muted p-20">Cargando...</li>
            </ul>
        </section>

        <!-- Categorías y Fondos -->
        <a href="#" id="btn-gestionar-categorias" class="card dashboard-card-link" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; text-decoration: none; min-height: auto;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <i data-lucide="settings" style="color: var(--text-main);"></i>
                <div style="text-align: left;">
                    <h3 style="margin: 0; font-size: 1.1rem; color: var(--text-main);">Categorías y Fondos</h3>
                    <p style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">Gestionar lo que se puede gastar</p>
                </div>
            </div>
            <i data-lucide="chevron-right" style="color: var(--text-muted);"></i>
        </a>

        <!-- Sección: Invitar -->
        <section class="card">
            <h2>Invitar Miembros</h2>
            <button id="btn-compartir-invitacion" class="btn-share">
                <i data-lucide="share-2"></i> Compartir Enlace
            </button>
        </section>

        <!-- Sección: Zona de Peligro -->
        <section class="card">
            <h2 class="danger-title">Zona de Peligro</h2>
            <p style="color: var(--text-muted); margin-bottom: 15px; font-size: 0.9rem;">Esta acción es irreversible.</p>
            <button id="btn-eliminar-hogar" class="btn-danger">
                <i data-lucide="trash-2"></i> Eliminar Hogar
            </button>
        </section>
    </main>
    
    <!-- Modal Confirmar Eliminación -->
    <div id="modal-confirm-delete" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 style="color: var(--text-main); margin-top: 0;">¿Eliminar Hogar?</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Se borrarán todos los datos. Irreversible.</p>
            <div class="flex-between gap-10">
                <button id="btn-cancelar-delete" class="btn-secondary flex-1">Cancelar</button>
                <button id="btn-confirmar-delete" class="btn-danger" style="width: auto; flex: 1;">Sí, Eliminar</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav" id="nav-contextual"></nav>
    <div id="toast-container" class="toast"></div>
    
    <script type="module" src="js/auth_guard.js?v=11.0"></script>
    <script type="module" src="js/controller_config_hogar.js?v=11.0"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
