<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel de Control - Hogar</title>
    <link rel="stylesheet" href="css/styles.css?v=6.1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header flex-between">
        <button onclick="window.location.href='index.html'" class="btn-icon-white" title="Volver al Inicio">🏠</button>
        <h1 class="text-center flex-1">Panel de Control</h1>
        <div class="header-spacer"></div>
    </header>

    <main class="container">
    <div class="header-name-section mb-30">
        <div class="flex-between">
            <h2 id="display-nombre-hogar" class="text-xl-bold-navy">1° de Mayo 1382 1° C</h2>
            <button id="btn-edit-name-toggle" class="btn-icon-gray">✏️</button>
        </div>
        <div id="edit-name-box" style="display: none;" class="mt-10 flex-gap-10">
            <input type="text" id="edit-nombre-hogar" class="form-control" placeholder="Nuevo nombre...">
            <button id="btn-actualizar-nombre" class="btn-primary-sm">Guardar</button>
        </div>
    </div>

    <section class="card-clean mb-20">
        <div class="flex-between mb-15">
            <h3 class="text-sm-uppercase-bold">Miembros del equipo</h3>
            <button id="btn-compartir-invitacion" class="btn-add-circle" title="Invitar nuevo miembro">＋</button>
        </div>
        <ul id="lista-gestion-miembros" class="list-unstyled">
            </ul>
    </section>

    <section class="menu-navigable mb-30">
        <a href="admin_hogar.html?id=URL_ID" class="menu-item">
            <div class="menu-item-content">
                <span class="menu-icon">⚙️</span>
                <div class="menu-text">
                    <strong>Categorías y Fondos</strong>
                    <small>Gestionar lo que se puede gastar</small>
                </div>
            </div>
            <span class="chevron">›</span>
        </a>
    </section>

    <div class="danger-zone-minimal">
        <button id="btn-eliminar-hogar" class="btn-text-red">Eliminar este Hogar definitivamente</button>
    </div>
</main>

    <div id="modal-confirm-delete" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 class="text-lg-red-bold mb-15" style="margin-top: 0;">⚠️ ¿Eliminar Hogar?</h3>
            <p class="text-sm-gray mb-15">ESTO ES IRREVERSIBLE. Los integrantes ya no tendrán acceso, aunque los gastos históricos seguirán existiendo en la base de datos.</p>
            <div class="modal-buttons" style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" id="btn-cancelar-delete" class="btn-secondary" style="margin: 0;">Cancelar</button>
                <button type="button" id="btn-confirmar-delete" class="btn-primary" style="background-color: #d32f2f; margin: 0;">Sí, Eliminar</button>
            </div>
        </div>
    </div>
    
    <div id="toast-container" class="toast"></div>

    <script type="module" src="js/auth_guard.js?v=6.1"></script>
    <script type="module" src="js/controller_config_hogar.js?v=6.1"></script>
</body>
</html>
