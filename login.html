<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ingresar - Control de gastos</title>
    <link rel="stylesheet" href="css/styles.css?v=11.1">
    <meta name="theme-color" content="#2e7d32">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        document.documentElement.setAttribute(
            'data-theme', 
            localStorage.getItem('theme') || 'dark'
        );
    </script>
</head>
<body class="login-page">

    <div class="login-container">
        <div class="logo-app">
             <h1><i data-lucide="dollar-sign"></i> Control de gastos</h1>
             <p>Tu gestor de gastos compartido</p>
        </div>

        <div class="card">
            <h2 id="form-title" class="text-center mb-20">Iniciar Sesión</h2>
            
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="********">
                </div>

                <button type="submit" class="btn-primary" id="btn-accion">Ingresar</button>

                <div class="login-divisor">O</div>

                <button type="button" id="btn-google" class="btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" class="google-icon">
                    Continuar con Google
                </button>            
            </form>

<div class="toggle-form">
                 <span id="toggle-text">¿No tenés cuenta?</span> 
                 <a id="btn-toggle-mode"><i data-lucide="user-plus"></i> Registrate acá</a>
             </div>
        </div>
    </div>

    <div id="toast-container" class="toast"></div>
    <script type="module" src="js/controller_login.js?v=11.1"></script>
</body>
</html>
