<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Control de Gastos</title>
    <link rel="stylesheet" href="css/styles.css">
    <meta name="theme-color" content="#2e7d32">
    <style>
        /* Unos estilos rápidos para centrar el login */
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding-bottom: 0; background-color: #f5f5f5; }
        .login-container { width: 100%; max-width: 400px; padding: 20px; }
        .logo-app { text-align: center; margin-bottom: 30px; }
        .logo-app h1 { color: #2e7d32; font-size: 2rem; margin-bottom: 5px; }
        .logo-app p { color: #666; }
        .toggle-form { text-align: center; margin-top: 20px; font-size: 0.9rem; }
        .toggle-form a { color: #2e7d32; font-weight: bold; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-app">
            <h1>💸 Finanzas</h1>
            <p>Tu gestor de gastos compartido</p>
        </div>

        <div class="card">
            <h2 id="form-title" style="text-align: center; margin-bottom: 20px;">Iniciar Sesión</h2>
            
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="********">
                </div>

                <button type="submit" class="btn-primary" id="btn-submit">Ingresar</button>
            </form>

            <div class="toggle-form">
                <span id="toggle-text">¿No tenés cuenta?</span> 
                <a id="btn-toggle-mode">Registrate acá</a>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast"></div>

    <script type="module" src="js/controller_login.js"></script>
</body>
</html>
