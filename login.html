<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Finanzas</title>
    <link rel="stylesheet" href="css/styles.css?v=6.0">
    <meta name="theme-color" content="#2e7d32">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="logo-app">
            <h1>💸 Finanzas</h1>
            <p>Tu gestor de gastos compartido</p>
        </div>

        <div class="card">
            <h2 id="form-title" class="text-center mb-20">Iniciar Sesión</h2>
            
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="********">
                </div>

                <button type="submit" class="btn-primary" id="btn-accion">Ingresar</button>

                <div class="text-center mb-15" style="color: #666;">O</div>

                <button type="button" id="btn-google" class="btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Continuar con Google
                </button>            
            </form>

            <div class="toggle-form">
                <span id="toggle-text">¿No tenés cuenta?</span> 
                <a id="btn-toggle-mode">Registrate acá</a>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast"></div>
    <script type="module" src="js/controller_login.js?v=6.0"></script>
</body>
</html>
